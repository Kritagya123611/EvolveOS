version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: axiom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    container_name: axiom-postgres
    environment:
      POSTGRES_USER: axiom_admin
      POSTGRES_PASSWORD: axiom_password
      POSTGRES_DB: axiom_state
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # --- NEW: The Isolated Agent Workspace ---
  workspace:
    build:
      context: .
      dockerfile: Workspace.Dockerfile
    container_name: axiom-workspace
    volumes:
      - ./sandbox:/workspace # Mounts the container to your local folder

volumes:
  redis_data:
  pg_data: